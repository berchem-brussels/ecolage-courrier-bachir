# Gabarit nginx : ${HTTPS_PORT} est remplacé au démarrage par docker-entrypoint.sh (aucun port ni adresse en dur).
server {
    listen 80;
    server_name _;
    return 301 https://$host:${HTTPS_PORT}$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/app.crt;
    ssl_certificate_key /etc/nginx/ssl/app.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # HSTS seulement avec un certificat reconnu par les postes (standard v3.2, section 10.2) :
    # add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    location ~ /\. { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dépôt d'un fichier (POST /api/pieces) : un fichier par envoi, 50 Mo au plus (paramètre pieces.max_mb, plafond
    # technique), 51 Mo pour la marge de l'envoi multipart. Le serveur refuse au-delà du paramètre de l'instance.
    location = /api/pieces {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 51m;
        client_body_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Contenu d'une pièce, affiché dans un cadre de l'application même. Un add_header ici remplace ceux du serveur :
    # X-Frame-Options DENY et frame-ancestors 'none' ne s'ajoutent pas, la politique vient de l'API
    # (default-src 'none'; frame-ancestors 'self' et X-Frame-Options SAMEORIGIN).
    location ~ ^/api/pieces/[0-9]+/contenu$ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }
}
